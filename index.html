<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>在线图书馆 · 中英对照</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人在线图书馆，中英对照在线阅读" />
  <link rel="stylesheet" href="vendor/vue.css" />
  <style>
    :root { --theme-color: #42b983; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    .markdown-section { max-width: 920px; }
    .markdown-section img { max-width: 100%; border-radius: 4px; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); }
    /* 图片行上下留白，避免与正文粘连 */
    .markdown-section p > img { margin: 12px 0; }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>
  <script>
    window.$docsify = {
      name: '在线图书馆',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      mergeNavbar: true,
      notFoundPage: true,
      // 迁移前的旧链接（/#/part1_cn_en 等）自动指向新位置，避免收藏/缓存失效
      alias: {
        '/part1_cn_en': '/books/how-to-make-money-in-stocks/part1_cn_en',
        '/part2_cn_en': '/books/how-to-make-money-in-stocks/part2_cn_en',
        '/part3_cn_en': '/books/how-to-make-money-in-stocks/part3_cn_en',
        '/part1_cn_en/': '/books/how-to-make-money-in-stocks/part1_cn_en',
        '/part2_cn_en/': '/books/how-to-make-money-in-stocks/part2_cn_en',
        '/part3_cn_en/': '/books/how-to-make-money-in-stocks/part3_cn_en'
      },
      search: {
        placeholder: { '/': '搜索（中文 / English）' },
        noData: { '/': '没有找到结果' },
        depth: 3
      }
    };
  </script>
  <script>
    // 把所有以 / 开头的站内链接改写成 Docsify 内部 hash（#/...）。
    // 这样无论当前页面在根目录还是子目录，链接指向都唯一确定，不会随页面位置漂移。
    window.$docsify.plugins = [].concat(function (hook, vm) {
      hook.doneEach(function () {
        var sel = [
          '.sidebar-nav a[href]',
          '.app-name-link[href]',
          '.app-nav a[href]',
          '.markdown-section a[href]'
        ].join(',');
        var links = document.querySelectorAll(sel);
        for (var i = 0; i < links.length; i++) {
          var a = links[i];
          var h = a.getAttribute('href') || '';
          // 跳过图片链接（放大插件用），只处理文字链接
          if (a.querySelector('img')) { continue; }
          // 只处理站内绝对路径 /xxx ，排除 //host 与外部链接
          if (h.charAt(0) === '/' && h.charAt(1) !== '/') {
            a.setAttribute('href', '#' + h);
          }
        }
      });
    }, window.$docsify.plugins || []);
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/zoom-image.min.js"></script>
</body>
</html>
